name: update-profile-art

on:
  schedule:
    - cron: "20 18 * * *" # daily, ~04:20 AEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh contribution heatmap
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      # the portrait only changes when the source photo does — regenerate on manual runs
      - name: Regenerate ASCII portrait
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/make_ascii_svg.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile art" && git push)
