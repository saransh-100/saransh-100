<svg viewBox="0 0 440 238" width="440" height="238" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vmgd — WordPress · React · GraphQL. National platform delivering real-time weather warnings and disaster advisories, built for public accessibility and rapid updates.">
  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, monospace; }
    .ln  { white-space: pre; opacity: 0; animation: on .4s ease-out forwards; }
    .cur { opacity: 0; animation: on .01s linear 0.94s forwards, blink 1.1s steps(1) 0.94s infinite; }
    @keyframes on    { to { opacity: 1; } }
    @keyframes blink { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFFFFF" opacity=".02"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="438" height="236" rx="12" fill="url(#bg)"
        stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1.5"/>
  <circle cx="24" cy="20" r="4.5" fill="#3D3D3D"/>
  <circle cx="40" cy="20" r="4.5" fill="#5C5C5C"/>
  <circle cx="56" cy="20" r="4.5" fill="#8A8A8A"/>
  <text class="mono" x="220" y="24" text-anchor="middle" fill="#8A8A8A" font-size="10.5">~/projects/vmgd</text>
  <text class="mono" x="416" y="24" text-anchor="end" fill="#5C5C5C" font-size="10.5">[3/6]</text>
  <line x1="14" y1="38" x2="426" y2="38" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text class="mono ln" style="animation-delay:0.15s" x="24" y="66"><tspan fill="#5C5C5C">~ $ cat </tspan><tspan fill="#FFFFFF" font-size="14" font-weight="600">🌋 vmgd</tspan></text>
  <text class="mono ln" style="animation-delay:0.24s" x="24" y="86"><tspan fill="#8A8A8A" font-size="11">WordPress · React · GraphQL</tspan></text>
  <line x1="24" y1="98" x2="416" y2="98" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text class="mono ln" style="animation-delay:0.33s" x="24" y="120"><tspan fill="#9E9E9E" font-size="11.5">National platform delivering real-time weather warnings</tspan></text>
  <text class="mono ln" style="animation-delay:0.42s" x="24" y="137"><tspan fill="#9E9E9E" font-size="11.5">and disaster advisories, built for public accessibility</tspan></text>
  <text class="mono ln" style="animation-delay:0.51s" x="24" y="154"><tspan fill="#9E9E9E" font-size="11.5">and rapid updates.</tspan></text>
  <text class="mono ln" style="animation-delay:0.60s" x="24" y="213"><tspan fill="#5C5C5C" font-size="12">↗ </tspan><tspan fill="#F5F5F5" font-size="12">vmgd.gov.vu</tspan></text>
  <rect class="cur" x="129" y="203" width="7" height="12" fill="#F5F5F5"/>
  <rect x="16" y="42" width="408" height="188" fill="url(#scan)"/>
</svg>
