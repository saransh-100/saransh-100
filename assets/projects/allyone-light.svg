<svg viewBox="0 0 440 220" width="440" height="220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="allyone — Django · React · PostgreSQL. A secure, data-centric platform built for structured workflows and reliability at scale.">
  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, monospace; }
    .ln  { white-space: pre; opacity: 0; animation: on .4s ease-out forwards; }
    .cur { opacity: 0; animation: on .01s linear 0.85s forwards, blink 1.1s steps(1) 0.85s infinite; }
    @keyframes on    { to { opacity: 1; } }
    @keyframes blink { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2F2"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#111111" opacity=".02"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="438" height="218" rx="12" fill="url(#bg)"
        stroke="#111111" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="24" cy="20" r="4.5" fill="#C4C4C4"/>
  <circle cx="40" cy="20" r="4.5" fill="#A3A3A3"/>
  <circle cx="56" cy="20" r="4.5" fill="#8F8F8F"/>
  <text class="mono" x="220" y="24" text-anchor="middle" fill="#5C5C5C" font-size="10.5">~/projects/allyone</text>
  <text class="mono" x="416" y="24" text-anchor="end" fill="#8A8A8A" font-size="10.5">[2/6]</text>
  <line x1="14" y1="38" x2="426" y2="38" stroke="#111111" stroke-opacity=".08"/>
  <text class="mono ln" style="animation-delay:0.15s" x="24" y="66"><tspan fill="#8A8A8A">~ $ cat </tspan><tspan fill="#111111" font-size="14" font-weight="600">🔐 allyone</tspan></text>
  <text class="mono ln" style="animation-delay:0.24s" x="24" y="86"><tspan fill="#6E6E6E" font-size="11">Django · React · PostgreSQL</tspan></text>
  <line x1="24" y1="98" x2="416" y2="98" stroke="#111111" stroke-opacity=".1"/>
  <text class="mono ln" style="animation-delay:0.33s" x="24" y="120"><tspan fill="#5C5C5C" font-size="11.5">A secure, data-centric platform built for structured</tspan></text>
  <text class="mono ln" style="animation-delay:0.42s" x="24" y="137"><tspan fill="#5C5C5C" font-size="11.5">workflows and reliability at scale.</tspan></text>
  <text class="mono ln" style="animation-delay:0.51s" x="24" y="196"><tspan fill="#111111" font-size="12">↗ allyone.com.au</tspan></text>
  <rect class="cur" x="151" y="186" width="7" height="12" fill="#111111"/>
  <rect x="16" y="42" width="408" height="170" fill="url(#scan)"/>
</svg>
