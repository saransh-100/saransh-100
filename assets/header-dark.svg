<svg viewBox="0 0 900 400" width="900" height="400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, monospace; }
    .ascii { font-size: 13px; white-space: pre; }
    .cmd { font-size: 14px; }
    .win { animation: pop .7s cubic-bezier(.2,.9,.3,1.15) both; transform-origin: 450px 200px; }
    .l1 { animation: rise .5s ease-out .35s both; }
    .l2 { animation: rise .5s ease-out .47s both; }
    .l3 { animation: rise .5s ease-out .59s both; }
    .l4 { animation: rise .5s ease-out .71s both; }
    .l5 { animation: rise .5s ease-out .83s both; }
    .l6 { animation: rise .5s ease-out .95s both; }
    .sub { animation: rise .5s ease-out 1.15s both; }
    .c  { opacity: 0; animation: show .01s linear forwards; }
    .p1 { animation: rise .3s ease-out 1.55s both; }
    .o1 { animation: rise .35s ease-out 2.46s both; }
    .p2 { animation: rise .3s ease-out 3.01s both; }
    .o2 { animation: rise .35s ease-out 4.51s both; }
    .p3 { animation: rise .3s ease-out 5.11s both; }
    .cur { opacity: 0; animation: on .01s linear 5.41s forwards, blink 1.1s steps(1) 5.41s infinite; }
    .blobA { animation: driftA 16s ease-in-out infinite alternate; }
    .blobB { animation: driftB 20s ease-in-out infinite alternate; }
    @keyframes pop   { from { opacity: 0; transform: scale(.965) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes show  { to { opacity: 1; } }
    @keyframes on    { to { opacity: 1; } }
    @keyframes blink { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
    @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(70px,40px); } }
    @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-60px,-30px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E6E6E"/>
      <stop offset=".45" stop-color="#BDBDBD"/>
      <stop offset=".55" stop-color="#FFFFFF"/>
      <stop offset=".65" stop-color="#BDBDBD"/>
      <stop offset="1" stop-color="#6E6E6E"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#BDBDBD" stop-opacity=".3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".012"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#BDBDBD"/><stop offset="1" stop-color="#BDBDBD" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x="70" y="26" width="760" height="348" rx="18"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="900" height="400" fill="#000000"/>
  <g clip-path="url(#frame)" opacity=".22">
    <circle class="blobA" cx="220" cy="90" r="190" fill="url(#glowA)" opacity=".55"/>
    <circle class="blobB" cx="720" cy="330" r="220" fill="url(#glowB)" opacity=".45"/>
  </g>

  <g class="win">
    <rect x="70" y="26" width="760" height="348" rx="18" fill="#0D0D0D" fill-opacity=".72" stroke="url(#edge)" filter="none"/>
    <rect x="70" y="26" width="760" height="348" rx="18" fill="url(#sheen)"/>
    <line x1="70" y1="66" x2="830" y2="66" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="98" cy="46" r="6" fill="#F5F5F5"/>
    <circle cx="120" cy="46" r="6" fill="#8A8A8A"/>
    <circle cx="142" cy="46" r="6" fill="#3D3D3D"/>
    <text x="450" y="51" text-anchor="middle" class="mono" font-size="12" fill="#8A8A8A">saransh@github: ~</text>

    <g class="mono ascii" fill="url(#shimmer)" xml:space="preserve">
      <text class="l1" x="222" y="106">███████╗ █████╗ ██████╗  █████╗ ███╗   ██╗███████╗██╗  ██╗</text>
      <text class="l2" x="222" y="122">██╔════╝██╔══██╗██╔══██╗██╔══██╗████╗  ██║██╔════╝██║  ██║</text>
      <text class="l3" x="222" y="138">███████╗███████║██████╔╝███████║██╔██╗ ██║███████╗███████║</text>
      <text class="l4" x="222" y="154">╚════██║██╔══██║██╔══██╗██╔══██║██║╚██╗██║╚════██║██╔══██║</text>
      <text class="l5" x="222" y="170">███████║██║  ██║██║  ██║██║  ██║██║ ╚████║███████║██║  ██║</text>
      <text class="l6" x="222" y="186">╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝╚══════╝╚═╝  ╚═╝</text>
    </g>
    <text class="sub mono" x="450" y="214" text-anchor="middle" font-size="12" letter-spacing="6" fill="#8A8A8A">FULL-STACK&#160;WEB&#160;DEVELOPER</text>

    <g class="mono cmd" xml:space="preserve">
      <text class="p1" x="112" y="254" fill="#F5F5F5"><tspan fill="#FFFFFF">➜</tspan><tspan dx="10" fill="#9E9E9E">~</tspan><tspan dx="10"><tspan class="c" style="animation-delay:1.70s">w</tspan><tspan class="c" style="animation-delay:1.78s">h</tspan><tspan class="c" style="animation-delay:1.87s">o</tspan><tspan class="c" style="animation-delay:1.95s">a</tspan><tspan class="c" style="animation-delay:2.04s">m</tspan><tspan class="c" style="animation-delay:2.12s">i</tspan></tspan></text>
      <text class="o1" x="112" y="278" fill="#B3B3B3">full-stack developer <tspan fill="#5C5C5C">·</tspan> what works global <tspan fill="#5C5C5C">·</tspan> canberra, au</text>
      <text class="p2" x="112" y="306" fill="#F5F5F5"><tspan fill="#FFFFFF">➜</tspan><tspan dx="10" fill="#9E9E9E">~</tspan><tspan dx="10"><tspan class="c" style="animation-delay:3.16s">c</tspan><tspan class="c" style="animation-delay:3.24s">a</tspan><tspan class="c" style="animation-delay:3.33s">t</tspan><tspan class="c" style="animation-delay:3.41s">&#160;</tspan><tspan class="c" style="animation-delay:3.50s">s</tspan><tspan class="c" style="animation-delay:3.58s">t</tspan><tspan class="c" style="animation-delay:3.67s">a</tspan><tspan class="c" style="animation-delay:3.75s">c</tspan><tspan class="c" style="animation-delay:3.84s">k</tspan><tspan class="c" style="animation-delay:3.92s">.</tspan><tspan class="c" style="animation-delay:4.01s">t</tspan><tspan class="c" style="animation-delay:4.09s">x</tspan><tspan class="c" style="animation-delay:4.18s">t</tspan></tspan></text>
      <text class="o2" x="112" y="330" fill="#B3B3B3">next.js <tspan fill="#5C5C5C">│</tspan> typescript <tspan fill="#5C5C5C">│</tspan> payload cms <tspan fill="#5C5C5C">│</tspan> postgres <tspan fill="#5C5C5C">│</tspan> aws</text>
      <text class="p3" x="112" y="358" fill="#F5F5F5"><tspan fill="#FFFFFF">➜</tspan><tspan dx="10" fill="#9E9E9E">~</tspan></text>
      <rect class="cur" x="152" y="345" width="9" height="16" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
